name: pr-merge

on:
  pull_request:
    branches:
      - 'main'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.0
      - run: go test -race -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.0
      - run: go fmt ./...

  e2e:
    name: playwright e2e
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      # The suite runs inside docker build on a prebuilt playwright base image,
      # so no per-run node/browser install is needed.
      - name: Build and Test
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: _docker/Dockerfile.playwright-e2e
          push: false
          load: true
          cache-from: |
            type=gha,scope=${{ github.ref_name }}-playwright-e2e
            type=gha,scope=main-playwright-e2e
          cache-to: |
            type=gha,mode=max,scope=${{ github.ref_name }}-playwright-e2e
      - name: Extract report and traces
        if: ${{ !cancelled() }}
        run: |
          cid=$(docker create "${{ steps.build.outputs.imageid }}")
          docker cp "$cid:/app/tests/e2e/playwright-report" tests/e2e/ 2>/dev/null || true
          docker cp "$cid:/app/tests/e2e/test-results" tests/e2e/ 2>/dev/null || true
          docker rm "$cid"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  push_pr_to_registry:
    name: Push PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
        # Workaround to fix error:
        # failed to push: failed to copy: io: read/write on closed pipe
        # See https://github.com/docker/build-push-action/issues/761
        with:
          driver-opts: |
            image=moby/buildkit:latest
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: gtstef/hitime
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}