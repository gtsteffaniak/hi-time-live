name: pr-merge

on:
  pull_request:
    branches:
      - 'main'
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Every job here only needs to read the repository; nothing writes back to the
# repo or its issues, so keep the default token read-only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go test -race -v ./...
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
  format:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go fmt ./...
  e2e:
    name: playwright e2e
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npm run typecheck
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium firefox
        working-directory: tests/e2e
      - run: go build ./...
      # Host networking lets the browser on the runner reach the relay at
      # 127.0.0.1:3478, which is what the relay-only spec needs to connect.
      # Both peers run on the runner's loopback, so their relayed addresses are
      # loopback too; coturn rejects loopback peers by default ("error 403:
      # Forbidden IP"), which would leave the relay-only spec with no usable
      # candidate pair. --allow-loopback-peers is test-only and coturn refuses
      # to honour it without a non-empty CLI password.
      - name: start coturn relay
        run: |
          docker run -d --name coturn --network host coturn/coturn:4.6.2 \
            -n --lt-cred-mech --user hitime:hitime --realm hitime \
            --no-cli --no-tls --no-dtls --fingerprint \
            --allow-loopback-peers --cli-password=hitime \
            --listening-port 3478 --min-port 49160 --max-port 49200 --log-file=stdout
          sleep 3
          docker logs coturn | tail -5
      - run: npx playwright test
        working-directory: tests/e2e
        env:
          HITIME_TURN_URL: turn:127.0.0.1:3478
          HITIME_TURN_USERNAME: hitime
          HITIME_TURN_CREDENTIAL: hitime
      - name: playwright e2e under a base path
        run: npx playwright test --grep-invert firefox
        working-directory: tests/e2e
        env:
          HITIME_PORT: 9013
          HITIME_BASE_PATH: /hitime
          HITIME_TURN_URL: turn:127.0.0.1:3478
          HITIME_TURN_USERNAME: hitime
          HITIME_TURN_CREDENTIAL: hitime
      - name: coturn logs
        if: ${{ !cancelled() }}
        run: docker logs coturn | tail -50
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  docker_build:
    name: Build Docker
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
        # Workaround to fix error:
        # failed to push: failed to copy: io: read/write on closed pipe
        # See https://github.com/docker/build-push-action/issues/761
        with:
          driver-opts: |
            image=moby/buildkit:latest
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: gtstef/hitime
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}